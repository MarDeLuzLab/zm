const K = 'zm-key-' + P.s.slice(0, 8);
const norm = s => s.normalize('NFC').replace(/\s+/g, '');   // пробелы не важны, регистр букв важен
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const u2b = u => { let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function openWith(key) {
  const gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.d));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return html;
}
function show(html) { document.open(); document.write(html); document.close(); }
document.getElementById('sh').addEventListener('change', e => { document.getElementById('p').type = e.target.checked ? 'text' : 'password'; });
const f = document.getElementById('f'), e = document.getElementById('e'), btn = document.getElementById('b');
f.addEventListener('submit', async ev => {
  ev.preventDefault(); e.textContent = ''; btn.disabled = true; btn.textContent = '···';
  try {
    const key = await derive(norm(document.getElementById('p').value));
    const remember = document.getElementById('r').checked;
    const raw = remember ? u2b(new Uint8Array(await crypto.subtle.exportKey('raw', key))) : null;
    const html = await openWith(key);
    try { if (raw) localStorage.setItem(K, raw); } catch (_) {}
    show(html);
  } catch (_) {
    e.textContent = 'Contraseña incorrecta · Неверный пароль'; btn.disabled = false; btn.textContent = 'ENTRAR';
  }
});
(async () => {
  let raw = null; try { raw = localStorage.getItem(K); } catch (_) {}
  if (!raw) return;
  try { show(await openWith(await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', false, ['decrypt']))); }
  catch (_) { try { localStorage.removeItem(K); } catch (__) {} }
})();
